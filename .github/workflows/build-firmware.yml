name: Build Firmware

on:
  push:
    branches: [main]
    paths:
      - 'main/**'
      - 'CMakeLists.txt'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-ble:
    name: Build BLE firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build BLE firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.1
          target: esp32
          command: idf.py build

      - name: Collect BLE binaries
        run: |
          mkdir -p dist
          cp build/isotp_bridge.bin                    dist/funkbridge-ble.bin
          cp build/bootloader/bootloader.bin           dist/bootloader.bin
          cp build/partition_table/partition-table.bin dist/partition-table.bin
          echo "$(git describe --tags --always --dirty)-BLE" > dist/VERSION-BLE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-ble
          path: dist/
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/funkbridge-ble.bin
            dist/bootloader.bin
            dist/partition-table.bin
            dist/VERSION-BLE.txt
